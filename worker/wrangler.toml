name = "ptcg-line-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "https://pclub-tcg.github.io/ptcg-price/"
# CLAUDE_MODEL = "claude-sonnet-5-5"
# 密碼類請用 `npx wrangler secret put LINE_CHANNEL_SECRET` 等指令設定，不要寫在這裡

[ai]
binding = "AI"

# LINE 用的商品資料庫（全部商品）。database_id 由 GitHub Actions（tools/d1_sync.sh）部署時自動填入
[[d1_databases]]
binding = "DB"
database_name = "ptcg-bot"
database_id = "__D1_ID__"

# 每 10 分鐘結標競標並推播通知
[triggers]
crons = ["*/10 * * * *"]
