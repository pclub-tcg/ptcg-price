<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P’CLUB 競標市場</title>
<meta name="description" content="P’CLUB 寶可夢卡牌競標市場：用 LINE 登入，出價、上架自己的卡，附日本行情參考。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6ea;--surface:#fff;--surface-2:#fff3e6;--line:#f3dcc0;--ink:#2a1c17;--muted:#7a6656;--navy:#2a1c17;--navy-fg:#ffe0b8;--brand:#ff8a2b;--brand-ink:#2a1c17;--good:#1f8a5b;--bad:#c2333a;--hot:#e5482b;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;--f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;--logo:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
/* 頁首 */
.bar{background:var(--navy);color:var(--navy-fg);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.logo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:900;font-size:18px;color:var(--brand)}
.logo b{font-family:var(--logo);letter-spacing:.02em}
.logo svg{width:24px;height:24px}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who .nm{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff3e4;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid transparent;border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;min-height:42px;text-decoration:none;white-space:nowrap;background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.main{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:var(--brand)}
.btn.line{background:#06c755;border-color:#06c755;color:#fff}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:999px}
.btn.ghost{background:transparent;border-color:rgba(255,224,184,.35);color:var(--navy-fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* 首區 */
.hero{background:radial-gradient(800px 300px at 90% -40%,rgba(255,138,43,.35),transparent 70%),var(--navy);color:var(--navy-fg);padding:22px 0 26px}
.hero h1{margin:0;font-size:clamp(28px,6vw,40px);font-weight:900;color:#fff3e4;letter-spacing:.02em}
.hero p{margin:6px 0 0;font-size:14px;color:#d9bfa6}
.rules{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.rules::-webkit-scrollbar{display:none}
.rules span{white-space:nowrap;flex:none;background:rgba(255,138,43,.14);border:1px solid rgba(255,138,43,.4);color:#ffd2a6;border-radius:999px;padding:4px 12px;font-size:12.5px}
/* 工具列 */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 14px}.trow{display:flex;gap:10px;align-items:center;flex:1 1 360px;min-width:0}.trow .tabs{flex:1}.tabs button{flex:1}
.tabs button{white-space:nowrap}
@media (max-width:560px){.trow:first-child{flex-wrap:wrap}.trow .tabs{flex:1 1 100%;overflow-x:auto}.tabs button{padding:8px 4px;font-size:13.5px}#new{flex:1 1 100%}}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;border-radius:10px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--navy);color:var(--brand)}
.tools .grow{flex:1 1 180px;min-width:0}
.tools input[type=search],.tools select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;min-height:42px}
.tools select{width:auto}
/* 商品格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding-bottom:40px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(42,28,23,.12)}
.card:active{transform:scale(.98)}
.ph{aspect-ratio:4/5;background:linear-gradient(160deg,#3a271e,#21150f);display:grid;place-items:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .nophoto{color:#c8a88d;font-size:13px;text-align:center;padding:12px;font-weight:700}
.tags{position:absolute;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 16px)}
.tag{background:rgba(42,28,23,.85);color:var(--navy-fg);font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.tag.hot{background:var(--hot);color:#fff}
.tag.me{background:var(--good);color:#fff}
.tag.buy{background:var(--brand);color:var(--brand-ink)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{margin:0;font-size:15px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pr{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.pr small{color:var(--muted);font-size:12px}
.pr b{font-family:var(--f-num);font-size:19px;color:var(--hot)}
.meta{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted)}
.cd{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.cd.hot{color:var(--hot)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:18px}
/* 彈出視窗 */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(20,12,8,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--bg);width:min(720px,100%);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sh-head{position:sticky;top:0;z-index:2;background:var(--navy);color:var(--navy-fg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 14px 20px}
.sh-head h2{margin:0;font-size:17px;color:#fff3e4}
.x{border:0;background:rgba(255,255,255,.1);color:#fff;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;flex:none}
.sh-body{padding:16px;display:flex;flex-direction:column;gap:14px}
@media (max-width:560px){.sheet-bg{padding:0;align-items:flex-end}.sheet{border-radius:22px 22px 0 0;max-height:94vh;overflow-y:auto}}
.d-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (max-width:560px){.d-top{grid-template-columns:1fr}}
.d-ph{border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#3a271e,#21150f);aspect-ratio:4/5;display:grid;place-items:center}
.d-ph.np{aspect-ratio:16/9}.d-ph .nophoto{color:#c8a88d;font-weight:700;text-align:center;padding:12px}
@media (max-width:560px){.d-ph{max-height:62vh;aspect-ratio:auto;min-height:200px}.d-ph.np{min-height:120px}}
.d-ph img{width:100%;height:100%;object-fit:contain;background:#1b120d}
.d-info{display:flex;flex-direction:column;gap:10px}
.d-info h3{margin:0;font-size:20px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big .v{font-family:var(--f-num);font-size:32px;font-weight:600;color:var(--hot);line-height:1}
.big small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.big .t{text-align:right}
.big .t .cd{font-size:20px}
.bidrow{display:flex;gap:8px;margin-top:12px}
.bidrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:var(--f-num);font-size:18px;background:#fff}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.msg{font-size:13.5px;font-weight:700;margin:8px 0 0}
.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.hist b{font-family:var(--f-num)}
.hist .mine{color:var(--good);font-weight:700}
.win{background:#eaf7ef;border:1px solid #b7e2c7;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.7}
.row2{display:flex;gap:8px;flex-wrap:wrap}
/* 表單 */
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.f .full{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:44px;font-size:15px;color:var(--ink)}
.f textarea{min-height:80px;resize:vertical}
.up{border:2px dashed var(--line);border-radius:16px;background:var(--surface);min-height:150px;display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;text-align:center;color:var(--muted);font-size:14px}
.up img{max-height:260px;max-width:100%;display:block}
.agree{display:flex!important;flex-direction:row!important;align-items:flex-start;gap:8px;font-size:13px!important;line-height:1.6}
.agree input{width:20px;height:20px;min-height:0!important;margin-top:2px;flex:none;accent-color:var(--brand)}
.login-card{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 4px}
.login-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px 16px 40px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-fg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.tag.star{background:#ffd34d;color:#2a1c17}
.stat{font-size:12.5px;color:var(--muted)}.stat b{color:var(--good)}.stat i{font-style:normal;color:var(--bad)}
.rate{display:flex;flex-direction:column;gap:10px}
.rate .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rate .opts button[aria-pressed="true"]{background:var(--navy);color:var(--brand);border-color:var(--navy)}
.rate textarea{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:60px;font-size:14px;background:#fff}
.rate label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.rate label input{width:20px;height:20px;accent-color:var(--brand);margin:1px 0 0;flex:none}
.cat{position:relative}
.cat-list{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(42,28,23,.15);margin-top:4px;max-height:340px;overflow-y:auto}
.cat-list[hidden]{display:none}
.cat-it{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--surface-2)}
.cat-it:hover,.cat-it:focus{background:var(--surface-2);outline:none}
.cat-it img,.cat-it .ni{width:44px;height:60px;object-fit:contain;border-radius:4px;background:#f4ece2}
.cat-it b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-it small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-it em{font-style:normal;font-family:var(--f-num);font-size:13px;color:var(--hot);white-space:nowrap}
.refbox{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.adm{display:flex;flex-direction:column;gap:12px;grid-column:1/-1}
.adm .box h3{margin:0 0 8px;font-size:16px}
.adm-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.adm-row:last-child{border-bottom:0}
.adm-row p{margin:2px 0 0;color:var(--muted);font-size:13px;word-break:break-all}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="logo" href="./"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="3" width="18" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="2.4" transform="rotate(-8 16 16)"/><path d="M16.4 5.2c.9 3.9 5.6 5.9 5.6 11.4a6 6 0 0 1-12 0c0-2.6 1.3-4.3 2.8-5.4-.1 2.1.7 3.5 2.1 3.9-.5-3.7.2-6.9 1.5-9.9z" fill="currentColor"/></svg><b>P’CLUB</b></a>
  <div class="who" id="who"></div>
</div></header>

<section class="hero"><div class="wrap">
  <h1>競標市場</h1>
  <p>玩家之間的寶可夢卡競標。用 LINE 登入就能出價、上架，結標後雙方自行聯絡交易。</p>
  <div class="rules"><span>最後 3 分鐘有人出價自動延長</span><span>得標後 24 小時內聯絡賣家</span><span>不經手金流，請面交或用有保障的方式交易</span></div>
</div></section>

<main class="wrap">
  <div class="tools">
    <div class="trow"><div class="tabs" role="group" aria-label="競標分類"><button type="button" data-st="live" aria-pressed="true">進行中</button><button type="button" data-st="ended" aria-pressed="false">已結束</button><button type="button" data-st="watch" aria-pressed="false">關注</button><button type="button" data-st="mine" aria-pressed="false">我的</button><button type="button" data-st="admin" aria-pressed="false" id="tab-admin" hidden>管理</button></div>
    <button type="button" class="btn main" id="new">＋ 上架</button></div>
    <div class="trow"><div class="grow"><input type="search" id="q" placeholder="搜尋卡名、卡號" aria-label="搜尋競標"></div>
    <select id="sort" aria-label="排序"><option value="end">即將結束</option><option value="new">最新上架</option><option value="lo">價格低到高</option><option value="hi">價格高到低</option><option value="bids">出價最多</option></select></div>
  </div>
  <div class="grid" id="grid"><div class="empty">載入中…</div></div>
</main>

<footer>P’CLUB 競標市場只提供刊登與出價，不經手金流、不保證商品真偽與交易，請自行判斷風險。<br>發現詐騙或不實商品請按商品頁的「檢舉」。與寶可夢公司、任天堂無關。</footer>

<div class="sheet-bg" id="bg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sh-head"><h2 id="sh-t"></h2><button type="button" class="x" id="x" aria-label="關閉">×</button></div><div class="sh-body" id="sb"></div></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
const API=location.hostname==="localhost"&&new URLSearchParams(location.search).get("api")||"https://ptcg-line-bot.spickertop.workers.dev/api/a/";
const LINE_ADD="https://line.me/R/ti/p/@916ctmro", LINE_MSG="https://line.me/R/oaMessage/@916ctmro/?"+encodeURIComponent("競標");
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nt=v=>"NT$"+Math.round(v).toLocaleString("en-US");
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* LINE 帶來的 token：存起來後從網址拿掉 */
(function(){const m=location.hash.match(/t=([A-Za-z0-9_-]{20,64})/);if(m){LS.set("atok",m[1]);history.replaceState(null,"",location.pathname+location.search.replace(/[?&]openExternalBrowser=1/,"")+(/admin/.test(location.hash)?"#admin":""))}})();
let TOK=LS.get("atok",""),ME=null,ST="live",ITEMS=[],SKEW=0,CUR=null,TIMER=null;
const now=()=>Date.now()+SKEW;

async function api(path,body){
  const o={headers:{}};if(TOK)o.headers["x-tok"]=TOK;
  if(body){o.method="POST";o.headers["content-type"]="application/json";o.body=JSON.stringify(body)}
  let r;try{r=await fetch(API+path,o)}catch(e){throw new Error("連線失敗，請檢查網路")}
  const j=await r.json().catch(()=>({err:`系統忙碌，請稍後再試（錯誤 ${r.status}）`}));
  if(j.now)SKEW=j.now-Date.now();
  if(r.status===401&&j.login){TOK="";LS.del("atok");ME=null;drawWho()}
  if(!r.ok||j.err){const e=new Error(j.err||"發生錯誤");e.j=j;throw e}
  return j;
}
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function left(ms){if(ms<=0)return"已結束";const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60;
  return d?`${d} 天 ${h} 時`:h?`${h} 時 ${String(m).padStart(2,"0")} 分`:`${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`}
const photo=a=>a.photo?`<img src="${API}photo/${a.id}" alt="${esc(a.title)}" loading="lazy">`:`<span class="nophoto">${esc(a.title)}<br><small>賣家沒有附照片</small></span>`;
const minBid=a=>a.nbids?a.price+a.inc:a.start;

function drawWho(){
  $("tab-admin").hidden=!(ME&&ME.admin);
  $("who").innerHTML=ME?`<span class="nm">👤 ${esc(ME.name)}</span><button type="button" class="btn sm ghost" id="logout">登出</button>`:`<a class="btn sm line" href="${LINE_MSG}">LINE 登入</a>`;
  if(ME)$("logout").onclick=()=>{if(confirm("確定登出？之後要再從 LINE 傳「競標」登入。")){TOK="";LS.del("atok");ME=null;drawWho();if(ST==="mine")setTab("live");else load()}};
}

/* 列表 */
async function load(){
  if(ST==="admin")return loadAdmin();
  if(ST==="watch"&&!TOK){$("grid").innerHTML=`<div class="empty">${loginHtml("登入後可以關注商品，快結標時用 LINE 提醒你")}</div>`;return}
  if(ST==="mine"&&!TOK){$("grid").innerHTML=`<div class="empty">${loginHtml("登入後可以看自己上架、出價、得標的商品")}</div>`;return}
  try{const j=await api("list?st="+ST);ME=j.me;ITEMS=j.items;drawWho();draw()}
  catch(e){$("grid").innerHTML=`<div class="empty">${esc(e.message)}<br><button type="button" class="btn sm" onclick="location.reload()" style="margin-top:10px">重新整理</button></div>`}
}
function draw(){
  const q=$("q").value.trim().toLowerCase(),s=$("sort").value;
  let a=ITEMS.filter(x=>!q||(x.title+" "+(x.cond||"")+" "+(x.note||"")).toLowerCase().includes(q));
  const P=x=>x.nbids?x.price:x.start;

function bidBox(a,mb){

  if(a.leading)return `<p class="msg ok">你目前出價最高 👍 被超標時會用 LINE 通知你。</p>`;

function wireBid(a,mb,keepVal){
  if(!$("bid"))return;const inp=$("amt");if(keepVal&&+keepVal>=mb)inp.value=keepVal;
  document.querySelectorAll(".quick [data-k]").forEach(b=>b.onclick=()=>{inp.value=mb+a.inc*+b.dataset.k;arm(false)});
  let armed=false;const btn=$("bid");
  const arm=v=>{armed=v;btn.textContent=v?"確認出價 "+nt(+inp.value):"出價";btn.classList.toggle("dark",v)};
  inp.oninput=()=>arm(false);
  btn.onclick=async()=>{const v=Math.round(+inp.value);const m=$("bm");
    if(!(v>=mb)){m.className="msg err";m.textContent="最低要出 "+nt(mb);return}
    if(!armed)return arm(true);
    btn.disabled=true;m.className="msg";m.textContent="出價中…";
    try{const r=await api("bid",{id:a.id,amount:v});toast(r.won?"🎉 直購成功！":r.extended?"出價成功，結標時間延長 3 分鐘":"出價成功！");openItem(a.id,true);load()}
    catch(e){m.className="msg err";m.textContent=e.message;btn.disabled=false;arm(false);if(e.j&&e.j.min)setTimeout(()=>openItem(a.id,true),600)}};
  if($("buy"))$("buy").onclick=async()=>{if(!confirm(`確定用直購價 ${nt(a.buynow)} 買下？按確定就成交。`))return;
    try{await api("bid",{id:a.id,amount:a.buynow});toast("🎉 直購成功！");openItem(a.id,true);load()}catch(e){toast(e.message)}};
}

    try{PHOTO=await shrink(f);if(PURL)URL.revokeObjectURL(PURL);PURL=URL.createObjectURL(PHOTO);$("up").innerHTML=`<img src="${PURL}" alt="商品照片預覽">`}catch(er){PHOTO=null;$("up").textContent="這張照片讀不出來，請換一張"}};
  $("cf").onsubmit=async e=>{e.preventDefault();const m=$("cm");m.textContent="";
    const b={title:$("ti").value,cond:$("co").value,hours:+$("hr").value,start:+$("st").value,inc:+$("ic").value,buynow:$("bn").value?+$("bn").value:null,contact:$("ct").value,note:$("nt").value,ref:REF!=null?REF:(window.__REF||null)};
    if(!b.title.trim())return m.textContent="請填商品名稱";if(!(b.start>=1))return m.textContent="請填起標價";if(!b.contact.trim())return m.textContent="請填聯絡方式";
    if(!$("ag").checked)return m.textContent="請先勾選同意刊登規則";
    if(!PHOTO&&!confirm("沒有附照片的商品比較少人出價，確定不附照片？"))return;
    $("go").disabled=true;$("go").textContent="上架中…";
    try{const r=await api("create",b);LS.set("acontact",b.contact.trim());
      if(PHOTO){$("go").textContent="上傳照片中…";try{const pr=await fetch(API+"photo/"+r.id,{method:"POST",headers:{"x-tok":TOK,"content-type":"image/jpeg"},body:PHOTO});const pj=await pr.json().catch(()=>({}));if(!pr.ok)throw new Error(pj.err||"照片上傳失敗")}catch(pe){toast("商品已上架，但照片上傳失敗："+pe.message)}}
      toast("上架成功！");setTab("live");openItem(r.id)}
    catch(er){m.textContent=er.message;$("go").disabled=false;$("go").textContent="確認上架"}};
};
/* 照片壓縮：長邊 1200px，JPEG，控制在 400KB 內 */
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=async()=>{URL.revokeObjectURL(u);
  let w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,1200/Math.max(w,h)),q=.82,out=null;
  for(let i=0;i<6;i++){const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    out=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(out&&out.size<350*1024)break;s*=.8;q=Math.max(.6,q-.06)}
  out&&out.size<550*1024?res(out):rej()};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

})();
