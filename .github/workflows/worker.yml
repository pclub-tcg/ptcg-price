name: 部署 LINE 機器人
on:
  workflow_dispatch:
  page_build:            # 網站（site 分支）更新後，把新資料匯入 D1（D1 免費版每天寫入 10 萬列，一次匯入約 1.7 萬列）
  push:
    branches: [main]
    paths: [worker/**, tools/d1_sync.sh, .github/workflows/worker.yml]
concurrency:
  group: line-bot
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 沒設 CLOUDFLARE_API_TOKEN 就略過
        if: env.CF == ''
        run: echo "repo 的 Secrets 還沒有 CLOUDFLARE_API_TOKEN，先不部署"
      - name: 同步 D1 資料庫並部署 Worker（ptcg-line-bot，密鑰沿用）
        if: env.CF != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d7ec321df5316f68ceae4ebae90bc29d
        run: bash tools/d1_sync.sh
