name: 下載商品大圖
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["更新日版卡行情", "更新美版 PSA10 行情", "更新原盒行情"]
    types: [completed]
  push:
    branches: [main]
    paths: [tools/sids.json, tools/fetch_images.py, .github/workflows/images.yml]
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 取出已經下載過的圖片
        run: |
          git fetch origin img || true
          mkdir -p /tmp/img
          if git rev-parse --verify origin/img >/dev/null 2>&1; then git --work-tree=/tmp/img checkout origin/img -- . ; fi
          ls /tmp/img | wc -l
      - run: pip install pillow
      - name: 取出日版卡清單
        run: |
          mkdir -p /tmp/jp
          if git fetch -q origin jpdata; then git --work-tree=/tmp/jp checkout FETCH_HEAD -- jp.json || true; fi
          if git fetch -q origin endata; then git --work-tree=/tmp/jp checkout FETCH_HEAD -- en.json || true; fi
          if git fetch -q origin boxdata; then git --work-tree=/tmp/jp checkout FETCH_HEAD -- boxdata.json || true; fi
      - name: 下載並轉檔
        run: python3 tools/fetch_images.py tools/sids.json /tmp/img/hi /tmp/jp/jp.json /tmp/jp/en.json /tmp/jp/boxdata.json
      - name: 推到 img 分支（只留一個 commit）
        run: |
          cd /tmp/img
          git init -q -b img
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "商品大圖"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" img
