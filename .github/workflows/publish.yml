name: 每日發布網站
# 每天 10:41（台灣時間）用 tpl 分支的網站模板＋各資料分支，跑 tools/publish.sh 產生網站並推到 site 分支（GitHub Pages）。
# 網站更新後，worker.yml 會自動把資料同步到 LINE 機器人的 D1 資料庫。
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"   # 每天台灣時間 10:41
  push:
    branches: [main]
    paths: [.github/workflows/publish.yml, tools/publish.sh, tools/fetch_tcgj_op.py, tools/export.py, tools/patch_page.py, tools/inv.js, tools/inv.css, tools/auction.html, tools/market.html, tools/draw.html, tools/dex.html, tools/dex.py, tools/community.html, tools/notes.html, tools/bell.js, tools/pages.css, tools/cthread.js, tools/zhname.py, tools/richmenu.py, tools/guide.py, tools/guide_market.py, tools/guide_draw.py, tools/announce/**, tools/refresh_snkr.py, tools/theme.py, tools/theme.css, tools/theme.js, tools/boot.py, tools/publish_trigger.txt, tools/pwa.py, tools/slim.py, tools/app/**]   # publish_trigger.txt 由每日合併排程在同步 tpl 後更新，用來立刻發布網站＋LINE
permissions:
  contents: write
concurrency:
  group: publish-site
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 安裝中文字型與 Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra > /dev/null
          pip install -q pillow
          ls /usr/share/fonts/opentype/noto/ | grep -c NotoSansCJK
      - name: 取出網站模板（tpl 分支）
        run: |
          mkdir -p /tmp/tpl
          git fetch -q --depth 1 origin tpl
          git --work-tree=/tmp/tpl checkout FETCH_HEAD -- .
          git reset -q
          ls /tmp/tpl /tmp/tpl/sprites | head
      # 卡片目錄、比價商品、原盒的 SNKRDUNK 成交價與 K 線：直接在這裡抓（不再靠電腦上的瀏覽器排程）
      - name: 更新 SNKRDUNK 成交價（目錄卡、比價商品、原盒）
        timeout-minutes: 40
        env:
          BUDGET_MIN: "30"
        run: |
          git fetch -q --depth 1 origin jpdata && git show FETCH_HEAD:jp.json > /tmp/jp.json || echo "{}" > /tmp/jp.json
          python3 tools/refresh_snkr.py /tmp/tpl/index.html /tmp/tpl/kline.json /tmp/jp.json || echo "SNKRDUNK 更新失敗，沿用舊資料"
      - name: 產生網站並推到 site 分支
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash tools/publish.sh /tmp/tpl/index.html /tmp/tpl/kline.json /tmp/tpl/sprites 2>&1 | tail -15
      # 用 GitHub token 推的 site 分支不會觸發 page_build，所以 LINE 機器人的 D1 資料在這裡直接同步
      - name: 同步 LINE 機器人資料（D1）
        if: env.CF != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d7ec321df5316f68ceae4ebae90bc29d
          D1_SQL: /tmp/d1.sql
        run: bash tools/d1_sync.sh
